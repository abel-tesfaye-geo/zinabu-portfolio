remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"
locale: "en-US"

title: "Zinabu Getahun Sisay"
name: "Zinabu Getahun Sisay"
description: "Assistant Professor of Land Surveying, Photogrammetry and Remote Sensing at Bahir Dar University."
url: "https://abel-tesfaye-geo.github.io"
baseurl: "/zinabu-portfolio"
repository: "abel-tesfaye-geo/zinabu-portfolio"

search: true
words_per_minute: 200
markdown: kramdown

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist
  - jemoji

include:
  - _pages

author:
  name: "Zinabu Getahun Sisay"
  avatar: "/assets/images/zinabu.jpg"
  bio: "Assistant Professor of Land Surveying, Photogrammetry and Remote Sensing"
  location: "Bahir Dar, Ethiopia"
  employer: "Bahir Dar University"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:Newgz2012@gmail.com"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
